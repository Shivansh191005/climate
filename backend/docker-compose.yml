# Local PostgreSQL for development - NOT for AWS deployment (that's Stage 5, later)
version: "3.8"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: landsafe
    ports:
      - "5432:5432"
    volumes:
      - landsafe_pgdata:/var/lib/postgresql/data

volumes:
  landsafe_pgdata:
